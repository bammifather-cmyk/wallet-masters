plugins {
    id 'com.android.application'
}

android {
    namespace 'com.walletmasters.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.walletmasters.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            // Injected by CI from repo secrets
            if (project.hasProperty('WM_STORE_FILE')) {
                storeFile file(WM_STORE_FILE)
                storePassword WM_STORE_PASSWORD
                keyAlias WM_KEY_ALIAS
                keyPassword WM_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (project.hasProperty('WM_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
